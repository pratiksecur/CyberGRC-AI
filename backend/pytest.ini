[pytest]
markers =
    postgres: tests that need a real PostgreSQL server (set TEST_DATABASE_URL)

# PyJWT warns when an HMAC key is shorter than 32 bytes. The tests use the
# short development key and deliberately wrong keys, so the warning is noise
# here. In staging and production the app refuses to start with a SECRET_KEY
# shorter than 32 characters (see app/core/config.py).
filterwarnings =
    ignore:The HMAC key is