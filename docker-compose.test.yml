# Throw-away PostgreSQL used only by the PostgreSQL test suite.
#
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down -v
#
# It has its own project name, container, port and (in-memory) storage, so it
# can never touch the application database or your demo data.

name: cybergrc-test

services:
  postgres-test:
    image: postgres:17-alpine
    container_name: cybergrc-postgres-test
    init: true

    environment:
      POSTGRES_DB: cybergrc_test
      POSTGRES_USER: cybergrc_test
      POSTGRES_PASSWORD: cybergrc_test_only

    # Reachable from this computer only.
    ports:
      - "127.0.0.1:55432:5432"

    # Data lives in memory and disappears when the container stops.
    tmpfs:
      - /var/lib/postgresql/data

    # Speed over durability: acceptable for disposable test data.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybergrc_test -d cybergrc_test"]
      interval: 3s
      timeout: 3s
      retries: 20