# ==========================================================
# CyberGRC-AI Production Frontend
# Nginx configuration
# ==========================================================
worker_processes auto;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    server {
        listen 80;

        server_name _;

        root /usr/share/nginx/html;

        index index.html;

        # --------------------------------------------------
        # Security headers
        # --------------------------------------------------

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # --------------------------------------------------
        # React SPA
        # --------------------------------------------------

        location / {
            try_files $uri $uri/ /index.html;
        }

        # --------------------------------------------------
        # Static assets
        # --------------------------------------------------

        location ~* \.(?:css|js|mjs|json|svg|png|jpg|jpeg|gif|ico|webp|woff|woff2|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            try_files $uri =404;
        }

        # --------------------------------------------------
        # Never expose hidden files
        # --------------------------------------------------

        location ~ /\. {
            deny all;
        }

        # --------------------------------------------------
        # Frontend health endpoint
        # --------------------------------------------------

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}