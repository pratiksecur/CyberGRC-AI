services:

  # ========================================================
  # PostgreSQL
  # ========================================================

  postgres:
    image: postgres:17-alpine

    container_name: cybergrc-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: cybergrc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d cybergrc"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ========================================================
  # Backend
  # ========================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cybergrc-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      # ----------------------------------------------------
      # Application
      # ----------------------------------------------------

      ENVIRONMENT: ${ENVIRONMENT:-development}

      PROJECT_NAME: ${PROJECT_NAME:-CyberGRC AI}
      PROJECT_VERSION: ${PROJECT_VERSION:-1.0.0}

      # ----------------------------------------------------
      # Database
      # ----------------------------------------------------

      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/cybergrc"

      # ----------------------------------------------------
      # Authentication
      # ----------------------------------------------------

      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}

      ALGORITHM: ${ALGORITHM:-HS256}

      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # ----------------------------------------------------
      # HTTP Security
      # ----------------------------------------------------

      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-12582912}

      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

      # ----------------------------------------------------
      # AI
      # ----------------------------------------------------

      AI_PROVIDER: ${AI_PROVIDER:-ollama}

      OLLAMA_BASE_URL: http://host.docker.internal:11434/api/generate

      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}

      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}

    volumes:
      - uploads_data:/app/uploads

    ports:
      - "8000:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ========================================================
  # Frontend
  # ========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: http://localhost:8000/api/v1

    container_name: cybergrc-frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "5173:80"

    security_opt:
      - no-new-privileges:true


# ==========================================================
# Persistent Volumes
# ==========================================================

volumes:

  postgres_data:

  uploads_data: