services:

  # ========================================================
  # PostgreSQL
  # ========================================================

  postgres:
    image: postgres:17-alpine
    container_name: cybergrc-postgres
    restart: unless-stopped
    init: true

    environment:
      POSTGRES_DB: cybergrc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cybergrc"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ========================================================
  # One-shot database migration job
  # ========================================================

  migrate:
    profiles: ["migrate"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybergrc-migrate
    restart: "no"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/cybergrc"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    command: ["alembic", "upgrade", "head"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ========================================================
  # Backend
  # ========================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybergrc-backend
    restart: unless-stopped
    init: true

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PROJECT_NAME: ${PROJECT_NAME:-CyberGRC AI}
      PROJECT_VERSION: ${PROJECT_VERSION:-1.0.0}

      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/cybergrc"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}

      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-12582912}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}


      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-900}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-250}
      SCHEDULER_LOCK_KEY: ${SCHEDULER_LOCK_KEY:-704001}

      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}

    volumes:
      - uploads_data:/app/uploads

    ports:
      - "8000:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ========================================================
  # Frontend
  # ========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-http://localhost:8000}

    container_name: cybergrc-frontend
    restart: unless-stopped
    init: true

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "5173:80"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/health | grep -q '^ok$'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ==========================================================
# Persistent Volumes
# ==========================================================

volumes:
  postgres_data:
  uploads_data:
